<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnythingScreensaver</title>
  <link rel="stylesheet" href="assets/style.css" type="text/css">
</head>
<body>
  <div class="content">
    <img class="img">
    <div class="modal">
      <div class="modal-content">
        <button class="button" onclick="closeModal()" title="Close (Esc)">X</button>
        <h2>AnythingScreensaver</h2>
        <p><b>press the button below to get started.</b> afterwards, to open this menu, press the <b>S</b> key on your keyboard.</p>
        <label class="button" title="Upload image (u)" for="upload">
          Upload image
          <input id="upload" type="file" accept="image/*" style="display:none;">
        </label>
        <noscript><br><br>[!] Please enable JavaScript for AnythingScreensaver to work [!]</noscript>
        <br><br><hr>
        <p><small>Made with &lt;3 by <b>Avery</b>&nbsp;&middot;&nbsp;<a href="https://github.com/AveryEclipse/anythingscreensaver">Source code & Privacy Notice</a></small></p>
        <a href="http://avery.is-a.dev"><img src="http://avery.is-a.dev/img/8831/avery2.png" style="image-rendering:pixelated;"></a>
      </div>
    </div>
  </div>
  <script src="assets/screensaver.js"></script>
</body>
</html>
